<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: en Chrome Android el teclado achica el layout
         en vez de taparlo, así 100dvh ya deja el composer arriba del teclado. iOS lo
         ignora; ahí lo resuelve useKeyboard.ts con visualViewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f4fb" />
    <title>Blink — Conexiones que duran lo que tienen que durar</title>
    <meta name="description" content="90 segundos. Una persona. Sin swipe." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
